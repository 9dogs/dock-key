name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0.' >&2
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Run tests
        run: ./test.sh
      - name: Build application
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh
      - name: Verify and package
        run: |
          test "$(lipo -archs DockKey.app/Contents/MacOS/DockKey)" = arm64
          codesign --verify --deep --strict DockKey.app
          plutil -lint DockKey.app/Contents/Info.plist
          ditto -c -k --sequesterRsrc --keepParent DockKey.app DockKey-arm64.zip
          shasum -a 256 DockKey-arm64.zip > DockKey-arm64.zip.sha256
      - name: Upload downloadable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DockKey-arm64
          path: |
            DockKey-arm64.zip
            DockKey-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DockKey-arm64
      - name: Publish application and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" DockKey-arm64.zip DockKey-arm64.zip.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" DockKey-arm64.zip DockKey-arm64.zip.sha256 \
              --verify-tag --title "DockKey $RELEASE_TAG" --generate-notes \
              --notes 'Native Apple Silicon build for macOS 13 or later. Ad-hoc signed; not Apple notarized. See the README for installation instructions and limitations.'
          fi
